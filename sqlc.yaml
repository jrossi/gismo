version: "2"
sql:
  - engine: "sqlite"
    queries: "pkg/database/sqlc/queries.sql"
    schema: "pkg/database/migrations/"
    gen:
      go:
        package: "db"
        out: "pkg/database/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        json_tags_case_style: "snake"