syntax = "proto3";

package gismo.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/jrossi/gismo/pkg/generated/gismo/v1;gismov1";

service KnowledgeService {
  // Docset management
  rpc ImportDocset(ImportDocsetRequest) returns (stream ImportProgress);
  rpc ListDocsets(ListDocsetsRequest) returns (ListDocsetsResponse);
  rpc RemoveDocset(RemoveDocsetRequest) returns (RemoveDocsetResponse);

  // Search operations
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetContent(GetContentRequest) returns (GetContentResponse);

  // Exa.ai search integration
  rpc ExaSearch(ExaSearchRequest) returns (ExaSearchResponse);
  rpc ProvideFeedback(SearchFeedbackRequest) returns (SearchFeedbackResponse);
  rpc GetCachedSearches(GetCachedSearchesRequest) returns (GetCachedSearchesResponse);

  // Exa Research API (expensive, structured data extraction)
  rpc CreateResearchTask(CreateResearchTaskRequest) returns (CreateResearchTaskResponse);
  rpc GetResearchTaskStatus(GetResearchTaskStatusRequest) returns (GetResearchTaskStatusResponse);
  rpc CancelResearchTask(CancelResearchTaskRequest) returns (CancelResearchTaskResponse);
  rpc ListActiveResearchTasks(ListActiveResearchTasksRequest) returns (ListActiveResearchTasksResponse);

  // Raw SQL access
  rpc ExecuteQuery(QueryRequest) returns (QueryResponse);
  rpc ExecuteQueryStream(QueryRequest) returns (stream QueryResult);
}

// Project context for all requests
message ProjectContext {
  string project_path = 1;      // Absolute path to project directory (e.g., /Users/jrossi/src/gismo)
  string project_name = 2;      // Claude project name format (e.g., -Users-jrossi-src-gismo)
  string claude_project_id = 3; // Optional Claude project ID if available
}

// Import docset request with URL or local path
message ImportDocsetRequest {
  ProjectContext context = 1;  // Project context for request
  oneof source {
    string url = 2;        // Download from URL (e.g., https://kapeli.com/feeds/Go.tgz)
    string local_path = 3; // Local .docset path
  }
  string name = 4;         // Optional override name
  bool force_reimport = 5; // Override if already imported
  map<string, string> metadata = 6;
}

// Import progress updates
message ImportProgress {
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    DOWNLOADING = 1;
    EXTRACTING = 2;
    PARSING = 3;
    IMPORTING = 4;
    INDEXING = 5;
    COMPLETE = 6;
    ERROR = 7;
  }

  Stage stage = 1;
  string message = 2;
  int32 progress_percent = 3;
  int32 items_processed = 4;
  int32 items_total = 5;
  string error = 6;  // Only set if stage == ERROR
  string docset_id = 7; // Set when COMPLETE
}

// List docsets request
message ListDocsetsRequest {
  ProjectContext context = 1;  // Project context for request
  // Optional filters
  string name_filter = 2;
  string language_filter = 3;
}

// List docsets response
message ListDocsetsResponse {
  repeated Docset docsets = 1;
}

// Docset information
message Docset {
  string id = 1;
  string name = 2;
  string version = 3;
  string language = 4;
  string source_url = 5;
  string source_type = 6; // 'official', 'user', 'custom'
  google.protobuf.Timestamp imported_at = 7;
  map<string, string> metadata = 8;
  int32 content_count = 9;
}

// Remove docset request
message RemoveDocsetRequest {
  ProjectContext context = 1;  // Project context for request
  string docset_id = 2;
}

// Remove docset response
message RemoveDocsetResponse {
  bool success = 1;
  string message = 2;
}

// Search request
message SearchRequest {
  ProjectContext context = 1;  // Project context for request
  string query = 2;
  repeated string docset_ids = 3;  // Empty = search all
  SearchType type = 4;
  int32 limit = 5;
  float min_score = 6;

  enum SearchType {
    SEARCH_TYPE_UNSPECIFIED = 0;
    KEYWORD = 1;
    SEMANTIC = 2;
    HYBRID = 3;  // Both keyword and semantic
  }
}

// Search response
message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_count = 2;
  int64 execution_time_ms = 3;
}

// Search result
message SearchResult {
  string docset_id = 1;
  string docset_name = 2;
  string item_name = 3;
  string item_type = 4;  // Class, Method, Function, etc.
  string content_preview = 5;
  float relevance_score = 6;
  string path = 7;
  int32 content_id = 8;
}

// Get content request
message GetContentRequest {
  ProjectContext context = 1;  // Project context for request
  int32 content_id = 2;
}

// Get content response
message GetContentResponse {
  string docset_id = 1;
  string name = 2;
  string type = 3;
  string path = 4;
  string content = 5;
  string summary = 6;
  map<string, string> metadata = 7;
}

// Query request for raw SQL
message QueryRequest {
  ProjectContext context = 1;  // Project context for request
  string sql = 2;
  google.protobuf.Struct parameters = 3;
  int32 max_rows = 4;  // Safety limit
  int32 timeout_ms = 5;
}

// Query response
message QueryResponse {
  repeated string columns = 1;
  repeated google.protobuf.Struct rows = 2;
  int32 affected_rows = 3;
  string error = 4;
  int64 execution_time_ms = 5;
}

// Streaming query result
message QueryResult {
  oneof result {
    QueryMetadata metadata = 1;
    google.protobuf.Struct row = 2;
    QueryComplete complete = 3;
    string error = 4;
  }
}

// Query metadata (sent first in stream)
message QueryMetadata {
  repeated string columns = 1;
}

// Query completion info
message QueryComplete {
  int32 total_rows = 1;
  int64 execution_time_ms = 2;
}

// Exa.ai search integration messages

// Exa search request
message ExaSearchRequest {
  ProjectContext context = 1;
  string query = 2;
  ExaSearchOptions options = 3;
  bool use_cache = 4;  // Default true
  float similarity_threshold = 5;  // For cache matching (default 0.8)
}

// Exa search options
message ExaSearchOptions {
  int32 num_results = 1;
  string search_type = 2;  // "neural", "keyword", "auto"
  bool use_autoprompt = 3;
  repeated string include_domains = 4;
  repeated string exclude_domains = 5;
  string start_published_date = 6;
  string end_published_date = 7;
  string category = 8;
}

// Exa search response
message ExaSearchResponse {
  string search_id = 1;
  repeated ExaResult results = 2;
  bool from_cache = 3;
  float cache_similarity = 4;
  int64 execution_time_ms = 5;
  string autoprompt_string = 6;
}

// Individual Exa search result
message ExaResult {
  string id = 1;
  string url = 2;
  string title = 3;
  string snippet = 4;
  string text = 5;
  string published_date = 6;
  string author = 7;
  float score = 8;
  repeated string highlights = 9;
  map<string, string> metadata = 10;
}

// Search feedback request
message SearchFeedbackRequest {
  ProjectContext context = 1;
  string search_id = 2;
  float usefulness_score = 3;  // 0.0 to 1.0
  repeated string useful_urls = 4;
  string feedback_type = 5;  // "implicit" or "explicit"
}

// Search feedback response
message SearchFeedbackResponse {
  bool success = 1;
  string message = 2;
  int32 updated_ttl_days = 3;
}

// Get cached searches request
message GetCachedSearchesRequest {
  ProjectContext context = 1;
  int32 limit = 2;  // Default 10
  string query_filter = 3;  // Optional filter by query text
}

// Get cached searches response
message GetCachedSearchesResponse {
  repeated CachedSearch searches = 1;
  int32 total_count = 2;
}

// Cached search info
message CachedSearch {
  string id = 1;
  string query = 2;
  string search_type = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_accessed = 5;
  int32 access_count = 6;
  int32 ttl_days = 7;
  int32 result_count = 8;
  float average_usefulness = 9;
}

// ============ Exa Research API ============

// Create research task request
message CreateResearchTaskRequest {
  ProjectContext context = 1;
  string instructions = 2;  // Max 4096 characters
  string model = 3;  // "exa-research" or "exa-research-pro"
  google.protobuf.Struct output_schema = 4;  // Optional JSON schema
  bool infer_schema = 5;  // Let LLM generate schema
  bool user_consent = 6;  // Required for expensive operations
  map<string, string> metadata = 7;  // Additional metadata
}

// Create research task response
message CreateResearchTaskResponse {
  string task_id = 1;
  string message = 2;
  float estimated_cost = 3;
  string warning = 4;  // Cost warning if applicable
}

// Get research task status request
message GetResearchTaskStatusRequest {
  ProjectContext context = 1;
  string task_id = 2;
}

// Get research task status response
message GetResearchTaskStatusResponse {
  string task_id = 1;
  string status = 2;  // pending, running, polling, completed, failed, canceled
  string progress_message = 3;
  google.protobuf.Struct result = 4;  // Structured result when completed
  repeated ResearchCitation citations = 5;
  string error = 6;
  float estimated_cost = 7;
  float actual_cost = 8;
  int64 elapsed_seconds = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

// Research citation
message ResearchCitation {
  string url = 1;
  string title = 2;
  string author = 3;
  string published_at = 4;
  repeated string quotes = 5;
}

// Cancel research task request
message CancelResearchTaskRequest {
  ProjectContext context = 1;
  string task_id = 2;
}

// Cancel research task response
message CancelResearchTaskResponse {
  bool success = 1;
  string message = 2;
}

// List active research tasks request
message ListActiveResearchTasksRequest {
  ProjectContext context = 1;
  int32 limit = 2;  // Default 20
  bool include_all_projects = 3;  // Show tasks from all projects
}

// List active research tasks response
message ListActiveResearchTasksResponse {
  repeated ResearchTaskSummary tasks = 1;
  int32 total_count = 2;
}

// Research task summary
message ResearchTaskSummary {
  string task_id = 1;
  string instructions = 2;
  string model = 3;
  string status = 4;
  string progress_message = 5;
  float estimated_cost = 6;
  int64 elapsed_seconds = 7;
  google.protobuf.Timestamp created_at = 8;
  string project_context = 9;
}