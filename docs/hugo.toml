baseURL = 'http://gismo.run/'
languageCode = 'en-us'
title = 'Gismo Documentation'
theme = 'docsy'

[params]
github_repo = 'https://github.com/jrossi/gismo'
github_branch = 'main'
copyright = "Gismo Contributors"
version_menu = "Releases"

# UI customization
ui = { sidebar_menu_compact = true, navbar_logo = true, footer_about_disable = false }
links_section_depth = 2

# Add custom CSS
custom_css = ['css/custom.css']

# Enable syntax highlighting
prism_syntax_highlighting = true

# Enable search
offlineSearch = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Documentation"
    url = "/docs/"
    weight = 10
  [[menu.main]]
    name = "CLI Reference"  
    url = "/docs/cli/"
    weight = 20
  [[menu.main]]
    name = "Library API"
    url = "/docs/library/"
    weight = 30
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/jrossi/gismo"
    weight = 50
