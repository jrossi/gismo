<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 500 500" style="enable-background:new 0 0 500 500;" xml:space="preserve">
<defs>
	<linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
		<stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
		<stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
	</linearGradient>
	<linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
		<stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
		<stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
	</linearGradient>
	<filter id="glow">
		<feGaussianBlur stdDeviation="4" result="coloredBlur"/>
		<feMerge>
			<feMergeNode in="coloredBlur"/>
			<feMergeNode in="SourceGraphic"/>
		</feMerge>
	</filter>
	<pattern id="circuitPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
		<rect x="0" y="0" width="40" height="40" fill="none"/>
		<circle cx="5" cy="5" r="2" fill="#e0e7ff" opacity="0.5"/>
		<circle cx="35" cy="35" r="2" fill="#e0e7ff" opacity="0.5"/>
		<path d="M5,5 L20,5 L20,20" stroke="#e0e7ff" stroke-width="1" fill="none" opacity="0.3"/>
		<path d="M35,35 L20,35 L20,20" stroke="#e0e7ff" stroke-width="1" fill="none" opacity="0.3"/>
	</pattern>
</defs>

<!-- Background circuit pattern -->
<rect x="0" y="0" width="500" height="500" fill="url(#circuitPattern)" opacity="0.15"/>

<!-- Main hexagon container with gradient -->
<g transform="translate(250,250)">
	<!-- Outer hexagon with gradient -->
	<polygon points="-120,0 -60,-104 60,-104 120,0 60,104 -60,104" 
		fill="url(#primaryGradient)" opacity="0.15"/>
	
	<!-- Inner hexagon -->
	<polygon points="-100,0 -50,-87 50,-87 100,0 50,87 -50,87" 
		fill="none" stroke="url(#primaryGradient)" stroke-width="3"/>
	
	<!-- Core gear system -->
	<g filter="url(#glow)">
		<!-- Central gear -->
		<g>
			<circle r="50" fill="url(#primaryGradient)"/>
			<!-- Gear teeth -->
			<g>
				<rect x="-5" y="-55" width="10" height="15" rx="2" fill="#4f46e5"/>
				<rect x="-5" y="40" width="10" height="15" rx="2" fill="#4f46e5"/>
				<rect x="-55" y="-5" width="15" height="10" rx="2" fill="#4f46e5"/>
				<rect x="40" y="-5" width="15" height="10" rx="2" fill="#4f46e5"/>
				<rect x="-35" y="-35" width="10" height="15" rx="2" fill="#4f46e5" transform="rotate(45 -30 -30)"/>
				<rect x="25" y="-35" width="10" height="15" rx="2" fill="#4f46e5" transform="rotate(-45 30 -30)"/>
				<rect x="-35" y="20" width="10" height="15" rx="2" fill="#4f46e5" transform="rotate(-45 -30 30)"/>
				<rect x="25" y="20" width="10" height="15" rx="2" fill="#4f46e5" transform="rotate(45 30 30)"/>
			</g>
			<!-- Inner circle -->
			<circle r="30" fill="#1e293b"/>
			<!-- G letter -->
			<text x="0" y="10" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
				fill="white" text-anchor="middle">G</text>
		</g>
	</g>
	
	<!-- Feedback loops with animation -->
	<g>
		<!-- Top-right loop -->
		<path d="M 40,-40 Q 80,-80 80,-20 Q 80,40 40,40" 
			fill="none" stroke="url(#accentGradient)" stroke-width="4" 
			stroke-linecap="round" stroke-dasharray="8,4">
			<animate attributeName="stroke-dashoffset" values="0;12" dur="2s" repeatCount="indefinite"/>
		</path>
		<polygon points="35,35 45,40 40,50" fill="url(#accentGradient)"/>
		
		<!-- Bottom-left loop -->
		<path d="M -40,40 Q -80,80 -80,20 Q -80,-40 -40,-40" 
			fill="none" stroke="url(#accentGradient)" stroke-width="4" 
			stroke-linecap="round" stroke-dasharray="8,4">
			<animate attributeName="stroke-dashoffset" values="0;12" dur="2s" repeatCount="indefinite"/>
		</path>
		<polygon points="-35,-35 -45,-40 -40,-50" fill="url(#accentGradient)"/>
	</g>
	
	<!-- Orbiting elements -->
	<g>
		<!-- Small gear 1 -->
		<g transform="translate(100,-60)">
			<circle r="20" fill="#f59e0b" opacity="0.8"/>
			<circle r="12" fill="#f97316"/>
			<rect x="-3" y="-20" width="6" height="8" rx="1" fill="#ea580c"/>
			<rect x="-3" y="12" width="6" height="8" rx="1" fill="#ea580c"/>
			<rect x="-20" y="-3" width="8" height="6" rx="1" fill="#ea580c"/>
			<rect x="12" y="-3" width="8" height="6" rx="1" fill="#ea580c"/>
		</g>
		
		<!-- Small gear 2 -->
		<g transform="translate(-100,60)">
			<circle r="20" fill="#8b5cf6" opacity="0.8"/>
			<circle r="12" fill="#7c3aed"/>
			<rect x="-3" y="-20" width="6" height="8" rx="1" fill="#6d28d9"/>
			<rect x="-3" y="12" width="6" height="8" rx="1" fill="#6d28d9"/>
			<rect x="-20" y="-3" width="8" height="6" rx="1" fill="#6d28d9"/>
			<rect x="12" y="-3" width="8" height="6" rx="1" fill="#6d28d9"/>
		</g>
		
		<!-- Speed indicators -->
		<g opacity="0.6">
			<line x1="-150" y1="0" x2="-130" y2="0" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
			<line x1="130" y1="0" x2="150" y2="0" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
			<line x1="0" y1="-150" x2="0" y2="-130" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
			<line x1="0" y1="130" x2="0" y2="150" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
		</g>
	</g>
	
	<!-- Floating particles for dynamism -->
	<g opacity="0.5">
		<circle cx="-80" cy="-100" r="3" fill="#6366f1">
			<animate attributeName="cy" values="-100;-110;-100" dur="3s" repeatCount="indefinite"/>
		</circle>
		<circle cx="90" cy="90" r="3" fill="#10b981">
			<animate attributeName="cy" values="90;100;90" dur="2.5s" repeatCount="indefinite"/>
		</circle>
		<circle cx="-70" cy="80" r="2" fill="#f59e0b">
			<animate attributeName="cx" values="-70;-80;-70" dur="2s" repeatCount="indefinite"/>
		</circle>
		<circle cx="100" cy="-90" r="2" fill="#8b5cf6">
			<animate attributeName="cx" values="100;110;100" dur="3.5s" repeatCount="indefinite"/>
		</circle>
	</g>
</g>

<!-- Brand text (optional, can be hidden for icon-only use) -->
<text x="250" y="450" font-family="Arial, sans-serif" font-size="42" font-weight="bold" 
	fill="url(#primaryGradient)" text-anchor="middle" opacity="0.8">GISMO</text>
</svg>